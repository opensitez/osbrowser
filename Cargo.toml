[package]
name = "osbrowser"
version = "0.5.0"
edition = "2024"
description = "webcore's API, driving the system browser: the same Document, window, events and canvas, rendered by Chrome, Firefox or Safari"
license = "GPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/opensitez/osbrowser"
readme = "README.md"
keywords = ["html", "dom", "browser", "gui", "canvas"]
categories = ["gui", "web-programming"]
include = ["src/**", "examples/**", "tests/**", "README.md", "LICENSE-GPL", "Cargo.toml"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
